name: Build & Release

# 태그를 밀면 (예: git tag v0.1.4 && git push --tags) 설치 파일이 만들어져
# GitHub Releases 에 올라간다. Actions 탭에서 손으로 돌릴 수도 있다.
#
# 맥은 로컬에서 `npm run release:mac` 이 15초면 끝나므로, 수동 실행 때는
# 기본적으로 윈도우만 만든다. 태그를 밀면 둘 다 만든다.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platforms:
        description: '무엇을 빌드할지'
        type: choice
        default: windows
        options: [windows, all]

permissions:
  contents: write

env:
  # 증분 컴파일 산출물은 CI 에서 재사용되지 않는데 캐시만 크게 만든다.
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # 잡 레벨 if 에서는 matrix 컨텍스트를 쓸 수 없다(매트릭스 전개 전에 평가된다).
  # 그래서 어떤 플랫폼을 빌드할지 여기서 정해 매트릭스 자체를 만들어 넘긴다.
  prepare:
    name: 대상 결정
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        env:
          # 러너는 저장소 변수로 바꾼다
          # (Settings > Secrets and variables > Actions > Variables).
          #   RUNNER_WINDOWS = 예) warp-windows-latest-x64-8x
          #   RUNNER_MACOS   = 예) warp-macos-latest-arm64-6x
          # 비워두면 GitHub 기본 러너를 쓴다. 라벨이 틀리면 잡이 러너를 기다리며
          # 멈추므로 WarpBuild 대시보드에 표시된 라벨을 그대로 넣어야 한다.
          WIN_RUNNER: ${{ vars.RUNNER_WINDOWS || 'windows-latest' }}
          MAC_RUNNER: ${{ vars.RUNNER_MACOS || 'macos-latest' }}
          WANT: ${{ github.event_name == 'workflow_dispatch' && inputs.platforms || 'all' }}
        run: |
          win=$(jq -nc --arg r "$WIN_RUNNER" '{
            platform: $r,
            target: "x86_64-pc-windows-msvc",
            toolchains: "x86_64-pc-windows-msvc",
            name: "Windows"
          }')
          mac=$(jq -nc --arg r "$MAC_RUNNER" '{
            platform: $r,
            target: "universal-apple-darwin",
            toolchains: "aarch64-apple-darwin,x86_64-apple-darwin",
            name: "macOS"
          }')

          if [ "$WANT" = "all" ]; then
            matrix=$(jq -nc --argjson w "$win" --argjson m "$mac" '{include: [$w, $m]}')
          else
            matrix=$(jq -nc --argjson w "$win" '{include: [$w]}')
          fi

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "빌드 대상: $matrix"

  build:
    needs: prepare
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Node 설치
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Rust 설치
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.toolchains }}

      - name: Rust 빌드 캐시
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          # 타겟이 다르면 캐시도 분리해야 서로 무효화하지 않는다.
          key: ${{ matrix.target }}

      # cargo 캐시가 비어 있는 첫 실행에서도 컴파일 결과를 재사용하게 해준다.
      - name: sccache 설치
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: 의존성 설치
        run: npm ci

      # Tauri 는 컴파일 시점에 프런트엔드 산출물(dist/)이 있어야 한다.
      - name: 프런트엔드 빌드
        run: npm run build

      # 테스트는 dev 프로파일로 전체를 한 번 더 컴파일한다. 플랫폼 무관한 로직만
      # 검증하므로 한 곳에서만 돌려 나머지 플랫폼의 시간을 아낀다.
      - name: 테스트
        if: runner.os == 'macOS'
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: 'true'
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: 빌드 & 릴리스 업로드
        id: tauri
        # 저장소의 Actions 쓰기 권한이 꺼져 있으면 릴리스 생성만 실패한다.
        # 빌드 자체는 끝난 상태이므로 잡을 죽이지 않고 아래에서 아티팩트로 올린다.
        continue-on-error: true
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: 'true'
        with:
          args: --target ${{ matrix.target }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          releaseName: 'Invoice Extractor ${{ github.ref_type == ''tag'' && github.ref_name || github.run_number }}'
          releaseBody: |
            ## 설치 방법

            **macOS** — `.dmg` 를 받아 앱을 응용 프로그램으로 옮긴 뒤,
            **우클릭 → 열기** 로 처음 한 번 실행하세요.
            (Apple 개발자 인증서로 서명되어 있지 않아 더블클릭으로는 열리지 않습니다.)

            "손상되었습니다" 가 뜨면 터미널에서:
            ```
            xattr -dr com.apple.quarantine "/Applications/Invoice Extractor.app"
            ```

            **Windows** — `.msi` 또는 `.exe` 를 실행하세요.
            "Windows에서 PC를 보호했습니다" 가 뜨면 **추가 정보 → 실행**.

            ---
            ⚠️ 이 앱은 그 PC에 설치되어 로그인된 **Claude Code** 를 사용합니다.
            먼저 `claude --version` 이 동작하는지 확인하세요.
          releaseDraft: false
          prerelease: false

      # 릴리스 생성이 막혀도 설치 파일은 받을 수 있어야 한다.
      # 아티팩트 업로드는 기본 읽기 권한만으로도 동작한다.
      - name: 설치 파일 업로드 (Actions 실행 페이지에서 다운로드)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe

      - name: 릴리스 업로드가 막혔을 때 안내
        if: steps.tauri.outcome == 'failure'
        run: |
          echo "::warning title=릴리스 생성 실패::설치 파일은 이 실행 페이지 아래 Artifacts 에서 받을 수 있습니다."
          echo "GitHub Releases 에 자동으로 올리려면 저장소 Settings > Actions > General >"
          echo "Workflow permissions 를 'Read and write permissions' 로 바꾸고 다시 실행하세요."
